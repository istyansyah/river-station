# ══════════════════════════════════════════════════════════════
# Mosquitto MQTT Broker Configuration
# River Station — IoT Monitoring & Early Warning System
# ══════════════════════════════════════════════════════════════

# ── Listener ──────────────────────────────────────────────────
listener 1883
protocol mqtt

# ── WebSocket listener (for browser-based clients) ────────────
listener 9001
protocol websockets

# ── Authentication ────────────────────────────────────────────
# Set to false for development; use password_file in production
allow_anonymous true

# ── Persistence ───────────────────────────────────────────────
# Retains messages across broker restarts
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── Connection Limits ─────────────────────────────────────────
max_connections 100
max_keepalive 120

# ── Message Limits ────────────────────────────────────────────
# Match firmware MQTT_MAX_PACKET_SIZE
message_size_limit 512
